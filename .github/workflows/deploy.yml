name: Deploy brb-baristas to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # SSH into EC2 and pull latest code, rebuild with secrets, restart
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST << EOF
          set -euo pipefail
          cd ~/brb-baristas-admin

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          cat > /tmp/VITE_FIREBASE_API_KEY << 'SEC'
          $FIREBASE_API_KEY
          SEC
          cat > /tmp/VITE_FIREBASE_AUTH_DOMAIN << 'SEC'
          $FIREBASE_AUTH_DOMAIN
          SEC
          cat > /tmp/VITE_FIREBASE_PROJECT_ID << 'SEC'
          $FIREBASE_PROJECT_ID
          SEC
          cat > /tmp/VITE_FIREBASE_STORAGE_BUCKET << 'SEC'
          $FIREBASE_STORAGE_BUCKET
          SEC
          cat > /tmp/VITE_FIREBASE_MESSAGING_SENDER_ID << 'SEC'
          $FIREBASE_MESSAGING_SENDER_ID
          SEC
          cat > /tmp/VITE_FIREBASE_APP_ID << 'SEC'
          $FIREBASE_APP_ID
          SEC
          cat > /tmp/VITE_GOOGLE_CALENDAR_ID << 'SEC'
          $GOOGLE_CALENDAR_ID
          SEC
          cat > /tmp/VITE_GOOGLE_CALENDAR_API_KEY << 'SEC'
          $GOOGLE_CALENDAR_API_KEY
          SEC

          docker stop brb-admin && docker rm brb-admin || true
          export DOCKER_BUILDKIT=1
          docker build --no-cache \
            --secret id=VITE_FIREBASE_API_KEY,src=/tmp/VITE_FIREBASE_API_KEY \
            --secret id=VITE_FIREBASE_AUTH_DOMAIN,src=/tmp/VITE_FIREBASE_AUTH_DOMAIN \
            --secret id=VITE_FIREBASE_PROJECT_ID,src=/tmp/VITE_FIREBASE_PROJECT_ID \
            --secret id=VITE_FIREBASE_STORAGE_BUCKET,src=/tmp/VITE_FIREBASE_STORAGE_BUCKET \
            --secret id=VITE_FIREBASE_MESSAGING_SENDER_ID,src=/tmp/VITE_FIREBASE_MESSAGING_SENDER_ID \
            --secret id=VITE_FIREBASE_APP_ID,src=/tmp/VITE_FIREBASE_APP_ID \
            --secret id=VITE_GOOGLE_CALENDAR_ID,src=/tmp/VITE_GOOGLE_CALENDAR_ID \
            --secret id=VITE_GOOGLE_CALENDAR_API_KEY,src=/tmp/VITE_GOOGLE_CALENDAR_API_KEY \
            -t brb-admin .

          rm -f /tmp/VITE_FIREBASE_API_KEY \
            /tmp/VITE_FIREBASE_AUTH_DOMAIN \
            /tmp/VITE_FIREBASE_PROJECT_ID \
            /tmp/VITE_FIREBASE_STORAGE_BUCKET \
            /tmp/VITE_FIREBASE_MESSAGING_SENDER_ID \
            /tmp/VITE_FIREBASE_APP_ID \
            /tmp/VITE_GOOGLE_CALENDAR_ID \
            /tmp/VITE_GOOGLE_CALENDAR_API_KEY

          docker run -d -p 3001:80 --name brb-admin brb-admin
          docker ps --filter name=brb-admin --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          docker inspect -f '{{.State.Running}}' brb-admin | grep true
          echo "Deployment complete and container is running."
          EOF
