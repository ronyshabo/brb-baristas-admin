name: Deploy brb-baristas to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID || secrets.VITE_GOOGLE_CALENDAR_ID }}
          VITE_GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY || secrets.VITE_GOOGLE_CALENDAR_API_KEY }}
        run: |
          set -euo pipefail
          EC2_SSH_PORT="${EC2_SSH_PORT:-2222}"

          required_vars=(
            EC2_HOST
            EC2_USER
            EC2_SSH_KEY
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "Missing required secret: $var_name"
              exit 1
            fi
          done

          VITE_FIREBASE_API_KEY_B64=$(printf %s "$VITE_FIREBASE_API_KEY" | base64 -w 0)
          VITE_FIREBASE_AUTH_DOMAIN_B64=$(printf %s "$VITE_FIREBASE_AUTH_DOMAIN" | base64 -w 0)
          VITE_FIREBASE_PROJECT_ID_B64=$(printf %s "$VITE_FIREBASE_PROJECT_ID" | base64 -w 0)
          VITE_FIREBASE_STORAGE_BUCKET_B64=$(printf %s "$VITE_FIREBASE_STORAGE_BUCKET" | base64 -w 0)
          VITE_FIREBASE_MESSAGING_SENDER_ID_B64=$(printf %s "$VITE_FIREBASE_MESSAGING_SENDER_ID" | base64 -w 0)
          VITE_FIREBASE_APP_ID_B64=$(printf %s "$VITE_FIREBASE_APP_ID" | base64 -w 0)
          VITE_GOOGLE_CALENDAR_ID_B64=$(printf %s "$VITE_GOOGLE_CALENDAR_ID" | base64 -w 0)
          VITE_GOOGLE_CALENDAR_API_KEY_B64=$(printf %s "$VITE_GOOGLE_CALENDAR_API_KEY" | base64 -w 0)

          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Checking port $EC2_SSH_PORT reachability on $EC2_HOST..."
          nc -zv -w 10 "$EC2_HOST" "$EC2_SSH_PORT" || {
            echo "ERROR: Cannot reach $EC2_HOST on port $EC2_SSH_PORT. Check EC2 security group and EC2_SSH_PORT secret."
            exit 1
          }

          ssh-keyscan -p "$EC2_SSH_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # SSH into EC2 and run deploy script via bash -s to bypass .bashrc interactive guards
          ssh -T -p "$EC2_SSH_PORT" -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" bash -s << EOF
          set -euo pipefail
          cd ~/brb-baristas-admin

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          printf '%s' "$VITE_FIREBASE_API_KEY_B64" | base64 -d > /tmp/VITE_FIREBASE_API_KEY
          printf '%s' "$VITE_FIREBASE_AUTH_DOMAIN_B64" | base64 -d > /tmp/VITE_FIREBASE_AUTH_DOMAIN
          printf '%s' "$VITE_FIREBASE_PROJECT_ID_B64" | base64 -d > /tmp/VITE_FIREBASE_PROJECT_ID
          printf '%s' "$VITE_FIREBASE_STORAGE_BUCKET_B64" | base64 -d > /tmp/VITE_FIREBASE_STORAGE_BUCKET
          printf '%s' "$VITE_FIREBASE_MESSAGING_SENDER_ID_B64" | base64 -d > /tmp/VITE_FIREBASE_MESSAGING_SENDER_ID
          printf '%s' "$VITE_FIREBASE_APP_ID_B64" | base64 -d > /tmp/VITE_FIREBASE_APP_ID
          printf '%s' "$VITE_GOOGLE_CALENDAR_ID_B64" | base64 -d > /tmp/VITE_GOOGLE_CALENDAR_ID
          printf '%s' "$VITE_GOOGLE_CALENDAR_API_KEY_B64" | base64 -d > /tmp/VITE_GOOGLE_CALENDAR_API_KEY

          export DOCKER_BUILDKIT=1
          docker build --no-cache \
            --secret id=VITE_FIREBASE_API_KEY,src=/tmp/VITE_FIREBASE_API_KEY \
            --secret id=VITE_FIREBASE_AUTH_DOMAIN,src=/tmp/VITE_FIREBASE_AUTH_DOMAIN \
            --secret id=VITE_FIREBASE_PROJECT_ID,src=/tmp/VITE_FIREBASE_PROJECT_ID \
            --secret id=VITE_FIREBASE_STORAGE_BUCKET,src=/tmp/VITE_FIREBASE_STORAGE_BUCKET \
            --secret id=VITE_FIREBASE_MESSAGING_SENDER_ID,src=/tmp/VITE_FIREBASE_MESSAGING_SENDER_ID \
            --secret id=VITE_FIREBASE_APP_ID,src=/tmp/VITE_FIREBASE_APP_ID \
            --secret id=VITE_GOOGLE_CALENDAR_ID,src=/tmp/VITE_GOOGLE_CALENDAR_ID \
            --secret id=VITE_GOOGLE_CALENDAR_API_KEY,src=/tmp/VITE_GOOGLE_CALENDAR_API_KEY \
            -t brb-admin:candidate .

          rm -f /tmp/VITE_FIREBASE_API_KEY \
            /tmp/VITE_FIREBASE_AUTH_DOMAIN \
            /tmp/VITE_FIREBASE_PROJECT_ID \
            /tmp/VITE_FIREBASE_STORAGE_BUCKET \
            /tmp/VITE_FIREBASE_MESSAGING_SENDER_ID \
            /tmp/VITE_FIREBASE_APP_ID \
            /tmp/VITE_GOOGLE_CALENDAR_ID \
            /tmp/VITE_GOOGLE_CALENDAR_API_KEY

          docker stop brb-admin && docker rm brb-admin || true
          docker tag brb-admin:candidate brb-admin:latest
          docker run -d -p 3001:80 --name brb-admin brb-admin:latest
          docker ps --filter name=brb-admin --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          docker inspect -f '{{.State.Running}}' brb-admin | grep true
          echo "Deployment complete and container is running."
          EOF
