name: Deploy brb-baristas to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A second push waits for the running deploy instead of racing it.
concurrency:
  group: deploy-brb-baristas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID || secrets.VITE_GOOGLE_CALENDAR_ID }}
          VITE_GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY || secrets.VITE_GOOGLE_CALENDAR_API_KEY }}
          VITE_GOOGLE_EVENTS_CALENDAR_ID: ${{ secrets.GOOGLE_EVENTS_CALENDAR_ID || secrets.VITE_GOOGLE_EVENTS_CALENDAR_ID }}
          VITE_GOOGLE_SCHEDULE_CALENDAR_ID: ${{ secrets.GOOGLE_SCHEDULE_CALENDAR_ID || secrets.VITE_GOOGLE_SCHEDULE_CALENDAR_ID }}
          VITE_GOOGLE_CALENDAR_TRUSTED_EDITORS: ${{ secrets.GOOGLE_CALENDAR_TRUSTED_EDITORS || secrets.VITE_GOOGLE_CALENDAR_TRUSTED_EDITORS }}
        run: |
          set -euo pipefail
          EC2_SSH_PORT="${EC2_SSH_PORT:-2222}"

          required_vars=(
            EC2_HOST
            EC2_USER
            EC2_SSH_KEY
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "Missing required secret: $var_name"
              exit 1
            fi
          done

          VITE_FIREBASE_API_KEY_B64=$(printf %s "$VITE_FIREBASE_API_KEY" | base64 -w 0)
          VITE_FIREBASE_AUTH_DOMAIN_B64=$(printf %s "$VITE_FIREBASE_AUTH_DOMAIN" | base64 -w 0)
          VITE_FIREBASE_PROJECT_ID_B64=$(printf %s "$VITE_FIREBASE_PROJECT_ID" | base64 -w 0)
          VITE_FIREBASE_STORAGE_BUCKET_B64=$(printf %s "$VITE_FIREBASE_STORAGE_BUCKET" | base64 -w 0)
          VITE_FIREBASE_MESSAGING_SENDER_ID_B64=$(printf %s "$VITE_FIREBASE_MESSAGING_SENDER_ID" | base64 -w 0)
          VITE_FIREBASE_APP_ID_B64=$(printf %s "$VITE_FIREBASE_APP_ID" | base64 -w 0)
          VITE_GOOGLE_CALENDAR_ID_B64=$(printf %s "$VITE_GOOGLE_CALENDAR_ID" | base64 -w 0)
          VITE_GOOGLE_CALENDAR_API_KEY_B64=$(printf %s "$VITE_GOOGLE_CALENDAR_API_KEY" | base64 -w 0)
          VITE_GOOGLE_EVENTS_CALENDAR_ID_B64=$(printf %s "$VITE_GOOGLE_EVENTS_CALENDAR_ID" | base64 -w 0)
          VITE_GOOGLE_SCHEDULE_CALENDAR_ID_B64=$(printf %s "$VITE_GOOGLE_SCHEDULE_CALENDAR_ID" | base64 -w 0)
          VITE_GOOGLE_CALENDAR_TRUSTED_EDITORS_B64=$(printf %s "$VITE_GOOGLE_CALENDAR_TRUSTED_EDITORS" | base64 -w 0)

          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Checking port $EC2_SSH_PORT reachability on $EC2_HOST..."
          nc -zv -w 10 "$EC2_HOST" "$EC2_SSH_PORT" || {
            echo "ERROR: Cannot reach $EC2_HOST on port $EC2_SSH_PORT. Check EC2 security group and EC2_SSH_PORT secret."
            exit 1
          }

          ssh-keyscan -p "$EC2_SSH_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # The server script below is quoted (nothing in it expands here). Its
          # inputs - the commit to deploy and the base64 secrets - go first as
          # plain assignments on stdin, so they never show up in a process list.
          SECRET_NAMES="VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_GOOGLE_CALENDAR_ID VITE_GOOGLE_CALENDAR_API_KEY VITE_GOOGLE_EVENTS_CALENDAR_ID VITE_GOOGLE_SCHEDULE_CALENDAR_ID VITE_GOOGLE_CALENDAR_TRUSTED_EDITORS"
          {
            printf 'DEPLOY_SHA=%q\n' "$GITHUB_SHA"
            printf 'SECRET_NAMES=%q\n' "$SECRET_NAMES"
            for name in $SECRET_NAMES; do
              b64_name="${name}_B64"
              printf '%s=%q\n' "$b64_name" "${!b64_name}"
            done
            cat << 'EOF'
          set -euo pipefail
          cd ~/brb-baristas-admin
          IMAGE="brb-admin:${DEPLOY_SHA:0:12}"

          # One build at a time on this server. Every BRB app that builds here
          # takes the same lock, so two deploys can't fight over its memory.
          exec 9>/tmp/brb-deploy.lock
          echo "Waiting for any other deploy on this server to finish..."
          flock -w 1800 9 || { echo "Gave up after 30 minutes waiting for another deploy."; exit 1; }

          # Each commit is built once; a rerun of the same commit reuses its image.
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE is already built - skipping the build."
          else
            # Exactly the commit that triggered this run, not whatever main is now.
            git fetch --quiet origin main
            git checkout --quiet --force --detach "$DEPLOY_SHA"

            # This deploy's own secrets folder, removed however the script ends.
            SECRETS_DIR="$(mktemp -d)"
            trap 'rm -rf "$SECRETS_DIR"' EXIT
            secret_args=()
            for name in $SECRET_NAMES; do
              b64_name="${name}_B64"
              printf '%s' "${!b64_name}" | base64 -d > "$SECRETS_DIR/$name"
              secret_args+=(--secret "id=$name,src=$SECRETS_DIR/$name")
            done

            # No --no-cache: the npm install layer is reused until package*.json change.
            DOCKER_BUILDKIT=1 docker build "${secret_args[@]}" -t "$IMAGE" .
          fi

          if [ "$(docker inspect -f '{{.Image}}' brb-admin 2>/dev/null)" = "$(docker image inspect -f '{{.Id}}' "$IMAGE")" ] \
            && [ "$(docker inspect -f '{{.State.Running}}' brb-admin 2>/dev/null)" = "true" ]; then
            echo "brb-admin is already running $IMAGE - nothing to swap."
          else
            docker stop brb-admin && docker rm brb-admin || true
            docker tag "$IMAGE" brb-admin:latest
            docker run -d -p 3001:80 --name brb-admin brb-admin:latest
          fi
          docker ps --filter name=brb-admin --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          docker inspect -f '{{.State.Running}}' brb-admin | grep true

          # Keep the three newest commit images for quick rollbacks; drop older ones.
          docker images brb-admin --format '{{.Tag}}' | grep -Ev '^(latest|candidate)$' | tail -n +4 \
            | xargs -r -I{} docker rmi "brb-admin:{}" || true
          echo "Deployment complete and container is running."
          EOF
          } | ssh -T -p "$EC2_SSH_PORT" -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" bash -s
